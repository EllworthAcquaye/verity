name: Verification gate

on:
  push:
    branches: [main, feat/e2e-platform]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.8.0
      - name: Install pinned pnpm
        run: corepack enable && corepack install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run static, architecture, and production-build gates
        run: pnpm check
      - name: Install pinned Python quality tools
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run Python and governed-model evaluation gates
        run: pnpm test:python && pnpm test:eval
      - name: Audit production dependencies
        run: pnpm security:audit
      - name: Generate CycloneDX software bill of materials
        run: pnpm supply-chain:sbom
      - name: Upload software bill of materials
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verity-sbom
          path: artifacts/sbom.cdx.json
          if-no-files-found: error

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan repository history for committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2

  governed-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.8.0
      - name: Install pinned browser test dependencies
        run: |
          corepack enable
          corepack install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Start the isolated review stack
        run: docker compose up -d --build
      - name: Exercise browser roles and the complete governed reviewer flow
        run: pnpm test:e2e:full
      - name: Verify evidence, approval, and promotion invariants
        run: pnpm test:integration && pnpm test:phase3
      - name: Exercise authenticated CI, outbox execution, and scheduling
        run: bash tests/operational-compose.sh
      - name: Enforce reviewer-edge performance thresholds
        run: pnpm test:performance
      - name: Capture service logs
        if: always()
        run: docker compose logs --no-color > verity-compose.log
      - name: Upload browser traces and service logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: governed-e2e-evidence
          path: |
            artifacts/playwright-results
            playwright-report
            verity-compose.log
          if-no-files-found: warn
      - name: Stop the review stack
        if: always()
        run: docker compose down -v
