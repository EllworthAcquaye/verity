name: Verification gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.8.0
      - name: Install pinned pnpm
        run: corepack enable && corepack install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run static, architecture, and production-build gates
        run: pnpm check

  governed-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.8.0
      - name: Start the isolated review stack
        run: docker compose up -d --build
      - name: Exercise authenticated CI, outbox execution, and scheduling
        run: bash tests/operational-compose.sh
      - name: Capture service logs
        if: always()
        run: docker compose logs --no-color > verity-compose.log
      - name: Stop the review stack
        if: always()
        run: docker compose down -v
