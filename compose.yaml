name: verity

services:
  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: verity
      POSTGRES_USER: verity
      POSTGRES_PASSWORD: verity-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verity -d verity"]
      interval: 3s
      timeout: 2s
      retries: 20
    networks: [control-data]
    volumes: [postgres-data:/var/lib/postgresql/data]

  redis:
    image: redis:8.10-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    networks: [queue]

  control:
    build: .
    environment:
      DATABASE_URL: postgresql://verity:verity-local-only@postgres:5432/verity
      REDIS_URL: redis://redis:6379
      VERITY_AI_MODE: cassette
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["3000:3000"]
    networks: [control-data, queue]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  runner:
    build: ./apps/runner
    environment:
      CONTROL_API_URL: http://control:3000/api/runner
      REDIS_URL: redis://redis:6379
      TARGET_BASE_URL: http://target:4000
      VERITY_AI_MODE: cassette
    depends_on:
      redis: { condition: service_healthy }
      target: { condition: service_healthy }
    networks: [execution, queue, target-boundary]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 3s
      timeout: 2s
      retries: 20

  target:
    build: ./apps/target
    networks: [target-boundary]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 3s
      timeout: 2s
      retries: 20

networks:
  control-data: { internal: true }
  execution: { internal: true }
  queue: { internal: true }
  target-boundary: { internal: true }

volumes:
  postgres-data:
